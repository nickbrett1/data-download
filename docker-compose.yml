# Docker Compose configuration for data-download
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/data-download:latest
    container_name: data-download
    restart: unless-stopped

    # Loopback only, deliberately. `tailscale serve` on the host is the ONLY
    # ingress: it proxies to 127.0.0.1:8820, so the container sees the bridge
    # gateway and can believe the identity header Serve injects. Publishing on
    # 0.0.0.0 re-opens approval: a connection to any address local to the host
    # (its LAN IP, its tailnet IP) is re-originated by Docker's port forward and
    # arrives from that same gateway, so any tailnet peer could forge
    # Tailscale-User-Login and approve spend. See deploy/README.md §6.
    ports:
      - "127.0.0.1:8820:8820"

    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      DATA_DOWNLOAD_DB: ${DATA_DOWNLOAD_DB}
      DATA_DOWNLOAD_API_TOKENS: ${DATA_DOWNLOAD_API_TOKENS}
      # The tailnet logins allowed to approve. Unset means nobody can: approval
      # is authorised by the identity `tailscale serve` asserts, not by a token.
      DATA_DOWNLOAD_APPROVERS: ${DATA_DOWNLOAD_APPROVERS:-}
      # Which peer may assert identity. Unset trusts loopback only, which is
      # right when the app runs on the host. Behind Docker's port forward the
      # Serve hop arrives from the bridge gateway, so name that address here.
      DATA_DOWNLOAD_TRUSTED_PROXIES: ${DATA_DOWNLOAD_TRUSTED_PROXIES:-}
      # Phase 4: the vendor key a request is priced with at submit. Unset means
      # nothing can be priced, so every submit is refused -- deliberately, since
      # an unpriced request is one whose approval authorises an unknown amount.
      DATA_DOWNLOAD_DATABENTO_KEY: ${DATA_DOWNLOAD_DATABENTO_KEY:-}
      # Phase 5: where a runner lands bytes --
      # `<dir>/<vendor>/<dataset>/<request_id>/`.
      # Unset means no request can be run (the runner refuses rather than
      # guessing), which is the right default for a host that has not decided
      # where its data lives.
      DATA_DOWNLOAD_DATASETS_DIR: ${DATA_DOWNLOAD_DATASETS_DIR:-/datasets}
      # Phase 5.5: where a driver's authoring transcript is readable, so the
      # plan-types page can link one. Unset means the conversation id is shown
      # and not turned into a link -- the id is still what finds it.
      DATA_DOWNLOAD_OPENHANDS_URL: ${DATA_DOWNLOAD_OPENHANDS_URL:-}
      # The driver runtime: the container that runs driver code and owns the
      # drivers volume. Unset means nothing can be installed, probed or run.
      DATA_DOWNLOAD_DRIVER_RUNTIME_URL: ${DATA_DOWNLOAD_DRIVER_RUNTIME_URL:-}
      DRIVER_RUNTIME_TOKEN: ${DRIVER_RUNTIME_TOKEN:-}
      # Phase 7: the driver queue. The forge token is what gates, merges and
      # fetches the tree that is installed; the agent server is what writes it.
      DATA_DOWNLOAD_GITHUB_TOKEN: ${DATA_DOWNLOAD_GITHUB_TOKEN:-}
      DATA_DOWNLOAD_DRIVER_REPO: ${DATA_DOWNLOAD_DRIVER_REPO:-nickbrett1/data-download-drivers}
      DATA_DOWNLOAD_DRIVER_BASE: ${DATA_DOWNLOAD_DRIVER_BASE:-main}
      DATA_DOWNLOAD_DRIVER_JOBS: ${DATA_DOWNLOAD_DRIVER_JOBS:-on}
      DATA_DOWNLOAD_DRIVER_JOBS_INTERVAL: ${DATA_DOWNLOAD_DRIVER_JOBS_INTERVAL:-60}
      # The agent's workspace and the key it generated, both mounted below. The
      # app has no docker socket, so a shared path is the only way in.
      DATA_DOWNLOAD_OPENHANDS_PROJECTS_DIR: ${DATA_DOWNLOAD_OPENHANDS_PROJECTS_DIR:-/projects}
      DATA_DOWNLOAD_OPENHANDS_KEY_FILE: ${DATA_DOWNLOAD_OPENHANDS_KEY_FILE:-/run/openhands/api-key.txt}
      DATA_DOWNLOAD_OPENHANDS_WORKDIR: ${DATA_DOWNLOAD_OPENHANDS_WORKDIR:-/projects/driver-loop}
      DATA_DOWNLOAD_AUTHOR_TIMEOUT: ${DATA_DOWNLOAD_AUTHOR_TIMEOUT:-3600}
      DATA_DOWNLOAD_AUTHOR_BUDGET: ${DATA_DOWNLOAD_AUTHOR_BUDGET:-2.00}
      DATA_DOWNLOAD_AUTHOR_ITERATIONS: ${DATA_DOWNLOAD_AUTHOR_ITERATIONS:-200}
    volumes:
      # The datasets root, one folder per requested dataset. Host-side path is
      # a share, not the container's layer: a bind mount is the only way these
      # bytes outlive an image pull. On ryzen that share is /srv/datasets; on a
      # Synology it is a /volume1 share. `docker compose exec app python -m
      # data_download.runner --next` runs one request in this same container,
      # so the runner sees the store and the datasets root together.
      - ${DATA_DOWNLOAD_DATASETS_HOST_DIR:-/srv/datasets}:/datasets
      # The agent's workspace, at the SAME path it has inside the agent: the
      # harness writes a push credential into it and the prompt names it, so a
      # different path here would be a credential the agent cannot read. The
      # app does not read the drivers volume -- the runtime owns that.
      - ${OPENHANDS_PROJECTS_HOST_DIR:-/srv/docker/openhands/projects}:/projects
      - ${OPENHANDS_KEY_HOST_FILE:-/srv/docker/openhands/data/agent-canvas/api-key.txt}:/run/openhands/api-key.txt:ro
    labels:
      - "homepage.group=Services"
      - "homepage.name=data-download"
      # The serve URL, not the host and port: `tailscale serve` is what adds
      # the identity header the approve door needs, and with the port bound to
      # loopback above, a link to ryzen:8820 does not load at all.
      - "homepage.href=https://ryzen.tail86fd19.ts.net/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:8820/healthz"
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Status"
    networks:
      - ai_proxy
networks:
  ai_proxy:
    external: true
