# The one plan type phase 1 ships, and deliberately the honest one: the shape
# that actually ran (all 13 G under /srv/datasets/databento carries batch
# receipts with `customizations: {split_duration: day}`).
#
# Reconciled in phase 2. This file stays DECLARATIVE: a param schema, a vendor,
# and the dataset patterns it claims. It deliberately has no `steps` section --
# steps are emitted by committed code, not declared here (the rejected design
# made every parameter change a step change).
#
# The binder that turns these params into a Job is
# `src/data_download/profiles/databento_batch_download.py`, resolved by this
# file's `name`. The driver protocol it binds against is `interpreter.py`; this
# Plan ships no driver in phase 2 (the offline one lives in `dryrun.py`).
#
# §13 Q1 is settled in the shape and not in the vendor's answer: raw_symbol,
# parent, continuous and instrument_id differ only in what string goes in
# `symbols`, so they are ONE Plan with a wider param space -- a difference in
# kwargs is not a different Plan. `stype_in` is therefore a required enum, and
# getting it wrong is a pricing question, not a registry one: the mis-priced
# ES.FUT ticket (§11.1) read `parent` where `continuous` was meant.
name: databento_batch_download
version: 1
description: >-
  A Databento batch job (batch.submit), split per day, downloaded with its
  manifest, metadata and condition receipts.

# Who sells the data, and which dataset codes are theirs. The read model names
# the vendor on a row because a dataset code alone (`XNAS.ITCH`) is vendor
# vocabulary and means nothing without it; a plan row gets the vendor from its
# plan type, and an intent -- which names a dataset but no plan type, not until
# a plan exists -- gets it from this list. An unclaimed dataset shows no vendor
# rather than a guess: the honest reading of an empty match is "no registered
# vendor speaks for this code yet".
vendor: Databento
datasets:
  - "*.ITCH"
  - "*.PILLAR"
  - "*.MDP3"
  - "*.IMPACT"
  - "EQUS.*"
  - "DBEQ.*"

# The **question** this Plan asks: which fields a person fills in, and the rules
# for filling them. It lives in `plan_types/forms/` because the shape is not
# Databento's -- any vendor quoting a symbol-scoped time window asks this same
# thing. What stays here is what really is Databento's: the vendor name, the
# dataset codes it speaks for, and the verify policy.
form: instruments_window

# Which committed binder turns those params into a Job. Named explicitly rather
# than implied by `name`, so a second vendor asking the same question reuses
# `profiles/databento_batch_download.py` instead of gaining a module of its own.
binder: databento_batch_download

verify:
  required: true
  on_failure: [commit_marked, quarantine]
  meaning: >-
    Compare the artifact against the vendor's own manifest: per-file sha256 and
    row counts. A shortfall (the manifest agrees the data was never published)
    may commit as landed_with_errors; a contradiction (the manifest claims what
    the file lacks) or a broken verifier quarantines instead.

resume: >-
  job_id is the anchor. Record it before downloading: a completed batch job can
  be refetched by id without paying again, whereas a streamed get_range has no
  such handle.
