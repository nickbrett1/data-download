# Homepage services.yaml snippet for data-download
# Generated by genproj (docker-container capability).
# Append to your Homepage services.yaml (under the "Services" group) and enable
# the homepage Docker provider.
#
# The href is the `tailscale serve` URL, and it is hand-set rather than derived
# from `hostname` in the genproj configuration: `hostname` yields
# `http://<host>:<port>/`, which is exactly the link that cannot approve.
# Reaching the app by host and port skips Serve, and Serve is the only thing
# that adds `Tailscale-User-Login`. Re-run genproj and this line is the one to
# re-check.
#
# The widget URL stays on loopback: Homepage runs with host networking here, so
# `localhost:8820` is the published port on the NAS, and `/healthz` needs no
# identity.
#
# The widget block is only emitted when a health mechanism is declared
# (docker-container `healthcheck` config); without one there is no endpoint to
# query, so the widget is omitted to avoid a perpetually-red status.

- data-download:
    icon: sh-docker
    href: https://ryzen.tail86fd19.ts.net/
    description: data-download container
    widget:
      type: customapi
      url: http://localhost:8820/healthz
      mappings:
        - field: status
          label: Status
