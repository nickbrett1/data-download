<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Dark from the first paint: a white flash before the bundle loads reads as
         a different site. Matches --bg, which the @nb theme defines in app.css. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="data-download" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- The icons and the manifest stay owned by FastAPI (/static, /site.webmanifest),
         because the home-screen entry existed before this frontend did and its URLs
         are baked into phones. -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <title>data-download</title>
    <style>
      /* iOS standalone samples the top of the viewport and blurs what is under
         it, so an opaque bar is not enough on its own: WebKit looks for a fixed
         box at the top edge, at least 90% of the width, with a background
         thicker than 10px, and without one it blurs the content instead. This
         is that box -- empty, fixed, full width, 11px. `background-clip: text`
         clips its background to no text at all, so WebKit gets a colour to
         sample and nothing is painted over the controls.
         See ui-registry README, "The iOS top-edge surface". */
      .pwa-status-bar-surface {
        display: none;
      }
      @supports (-webkit-touch-callout: none) and (background-clip: text) {
        @media (display-mode: standalone) {
          .pwa-status-bar-surface {
            display: block;
            position: fixed;
            inset: 0 0 auto;
            height: 11px; /* Must exceed WebKit's 10px thin-border threshold. */
            z-index: 100;
            pointer-events: none;
            background-color: inherit;
            -webkit-background-clip: text;
            background-clip: text;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="pwa-status-bar-surface" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
