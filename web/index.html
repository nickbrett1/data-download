<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No `viewport-fit=cover`. With it the web view extends under the iOS
         status bar, `env(safe-area-inset-top)` is non-zero, and whatever the
         system draws in that band lands on this app's own top bar -- which is
         what "murky top bar" was, through four attempts at repainting our side
         of it. Without it the viewport starts below the band and there is
         nothing of ours to composite over. The colour surface in <style> stays
         for the full-bleed case a future layout might want. -->
    <!-- Dark from the first paint: a white flash before the bundle loads reads as
         a different site. Matches --bg, which the @nb theme defines in app.css. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="data-download" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not translucent. `black-translucent` is the value that invites
         the page to be drawn *under* the status bar, and that band is the one
         place a home-screen window can composite something over our own bar.
         `black` asks for a solid strip with the page starting below it, so the
         top of the UI is our CSS and nothing else. Costs a black strip above a
         dark navy one; a crisp top nav is worth more than a seamless seam. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The icons and the manifest stay owned by FastAPI (/static, /site.webmanifest),
         because the home-screen entry existed before this frontend did and its URLs
         are baked into phones. -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <title>data-download</title>
    <style>
      /* iOS standalone samples the top of the viewport and blurs what is under
         it, so an opaque bar is not enough on its own: WebKit looks for a fixed
         box at the top edge, at least 90% of the width, with a background
         thicker than 10px, and without one it blurs the content instead. This
         is that box -- empty, fixed, full width, 11px. `background-clip: text`
         clips its background to no text at all, so WebKit gets a colour to
         sample and nothing is painted over the controls.
         See ui-registry README, "The iOS top-edge surface". */
      .pwa-status-bar-surface {
        display: none;
      }
      @supports (-webkit-touch-callout: none) and (background-clip: text) {
        @media (display-mode: standalone) {
          .pwa-status-bar-surface {
            display: block;
            position: fixed;
            inset: 0 0 auto;
            /* 11px clears the 10px thin-border threshold; the inset is added
               because the band WebKit composites over is the safe area. */
            height: calc(11px + env(safe-area-inset-top, 0px));
            z-index: 100;
            pointer-events: none;
            background-color: inherit;
            -webkit-background-clip: text;
            background-clip: text;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="pwa-status-bar-surface" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
