<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Dark from the first paint: a white flash before the bundle loads reads as
         a different site. Matches --bg, which the @nb theme defines in app.css. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="data-download" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- The icons and the manifest stay owned by FastAPI (/static, /site.webmanifest),
         because the home-screen entry existed before this frontend did and its URLs
         are baked into phones. -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <title>data-download</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // A Home Screen app on iOS is not "Safari with no chrome": the page is
      // composited against the standalone viewport and the status bar is drawn
      // over it. The sticky bar's `backdrop-filter` then samples the wrong
      // layer and the blur lands on the bar's own text -- the wordmark and the
      // tabs come out soft, permanently, not just while scrolling.
      //
      // `display-mode: standalone` covers modern iOS and is the CSS rule in
      // app.css. This class is the fallback for the versions that report
      // `browser` and expose `navigator.standalone` instead. Inline and before
      // the bundle, because a class added after paint is a visible flash of
      // the blur it exists to prevent.
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add("ios-standalone");
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
