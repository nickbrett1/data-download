{# Shared house theme: the same tokens and primitives as stratechery-search.
   Included by every page so a new page cannot drift from the dashboard. #}
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-raised: rgba(30, 41, 59, 0.55);
      --bg-sunken: rgba(15, 23, 42, 0.35);
      --bg-hover: rgba(51, 65, 85, 0.5);
      --bg-selected: #334155;
      --line: rgba(148, 163, 184, 0.14);
      --line-strong: rgba(148, 163, 184, 0.25);
      --ink: #e2e8f0;
      --ink-dim: #cbd5e1;
      --ink-muted: rgba(226, 232, 240, 0.62);
      --ink-faint: rgba(226, 232, 240, 0.42);
      --accent: #7dd3fc;
      --accent-soft: rgba(125, 211, 252, 0.14);
      --ok: #6ee7b7;
      --ok-bg: rgba(52, 211, 153, 0.15);
      --warn: #fdba74;
      --warn-bg: rgba(251, 146, 60, 0.15);
      --bad: #fca5a5;
      --bad-bg: rgba(248, 113, 113, 0.18);
      --neutral: #94a3b8;
      --neutral-bg: rgba(148, 163, 184, 0.15);
      --mark: #fce4b8;
      --mark-bg: rgba(252, 228, 184, 0.18);
      --radius: 8px;
      --radius-sm: 6px;
      --radius-pill: 999px;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.45 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    code, .num, .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ---------- sticky header ---------- */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .brand .slash { color: var(--ink-faint); font-weight: 400; margin: 0 2px; }
    .brand .sub { color: var(--ink-muted); font-weight: 400; }

    .spacer { flex: 1 1 auto; }
    .top .micro { white-space: nowrap; }

    /* ---------- layout ---------- */
    main {
      max-width: 68rem;
      margin: 0 auto;
      padding: 18px 18px 64px;
    }

    .lede {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }

    .sub-lede {
      margin: 0 0 16px;
      color: var(--ink-muted);
      max-width: 60ch;
    }

    /* ---------- filter strip (counts are the navigation) ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
    }

    .filter {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--bg-sunken);
      color: var(--ink-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .filter:hover {
      background: var(--bg-hover);
      color: var(--ink-dim);
      text-decoration: none;
    }

    .filter .n {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--ink);
    }

    .filter.is-on {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .filter.is-on .n { color: var(--accent); }
    .filter.is-zero { opacity: 0.55; }

    /* ---------- primitives ---------- */
    .micro, .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.5;
      color: var(--neutral);
      background: var(--neutral-bg);
      white-space: nowrap;
    }

    .pill.ok { color: var(--ok); background: var(--ok-bg); }
    .pill.warn { color: var(--warn); background: var(--warn-bg); }
    .pill.bad { color: var(--bad); background: var(--bad-bg); }
    .pill.info { color: var(--accent); background: var(--accent-soft); }

    .notice {
      border-left: 3px solid var(--line-strong);
      background: var(--bg-sunken);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 12px;
      margin: 0 0 16px;
      color: var(--ink-dim);
      max-width: 72ch;
    }

    .notice.accent { border-left-color: var(--accent); background: var(--accent-soft); }
    .notice code { color: var(--mark); }

    /* ---------- card ---------- */
    .card {
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px 14px;
      min-width: 0;
    }

    /* ---------- rows (no tables: stratechery has none) ---------- */
    .rows {
      display: grid;
      gap: 1px;
      background: var(--line);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .row {
      display: grid;
      grid-template-columns: var(--cols);
      align-items: baseline;
      gap: 10px;
      padding: 6px 8px;
      background: var(--bg-sunken);
    }

    .row.head {
      padding: 4px 8px;
      background: var(--bg-sunken);
    }

    .row:not(.head):hover { background: var(--bg-hover); }

    .row .cell {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink-dim);
    }

    .row .cell.id { color: var(--ink); }
    .row .cell.id code { font-size: 11.5px; }
    .row .cell.num { text-align: right; }
    .row .cell.detail { white-space: normal; color: var(--ink-muted); font-size: 12px; }
    .row.head .cell { color: var(--ink-faint); }

    .rows-all { --cols: minmax(9rem, 1.3fr) 7.5rem minmax(7rem, 1fr) 5.5rem 4.5rem minmax(10rem, 1.7fr); }

    .row .cell.why { color: var(--ink-muted); }
    .quiet { color: var(--ink-faint); }

    .empty-msg {
      margin: 8px 0 0;
      color: var(--ink-faint);
      font-style: italic;
      font-size: 12px;
    }

    /* ---------- foot ---------- */
    .foot {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--ink-muted);
      font-size: 12px;
    }

    .foot p { margin: 0 0 4px; }
    .foot code { color: var(--mark); font-size: 11px; }
    .foot .muted { color: var(--ink-faint); }

    @media (max-width: 600px) {
      body { font-size: 12.5px; }
      .grid { grid-template-columns: 1fr; }
      .row, .row.head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
      }
      .row.head { display: none; }
      .row .cell.num { text-align: left; }
    }
  </style>
