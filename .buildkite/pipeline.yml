# Generated by genproj. The pipeline itself is created during generation,
# together with its GitHub webhook — without that webhook a push triggers
# nothing at all, which is the failure mode to watch for.
#
# Which steps appear here is decided by the capabilities the project selects:
# the deployment capabilities contribute their deploy steps, secret-scan
# (gitleaks, required) and gitguardian contribute secret scans, lighthouse-ci
# the performance gate. The agent-side prerequisites for all of them are in
# .buildkite/README.md.

steps:
  - label: ":shield: Secret scan (gitleaks, full history)"
    key: secret_scan_gitleaks
    agents:
      queue: mac-studio-linux
    command: |
      bash scripts/install-gitleaks.sh
      "$$HOME/.local/bin/gitleaks" git --redact --verbose .

  - label: ":hammer: Build and test (python)"
    key: build
    agents:
      queue: mac-studio-linux
    plugins:
      - docker#v5.13.0:
          image: "python:3.13-slim"
          # The fleet is Apple silicon. Without this, docker resolves a
          # multi-arch tag to linux/amd64 and runs the whole step emulated (with
          # a warning, and native modules built for the wrong architecture).
          platform: linux/arm64
          workdir: /workdir
    commands:
      - python -m pip install --no-cache-dir -e ".[dev]"
      - python -m pip install --no-cache-dir build
      - python -m build
      - ruff check src tests
      - pytest -q

  - label: ":svelte: Build and test (frontend)"
    key: web
    agents:
      queue: mac-studio-linux
    plugins:
      - docker#v5.13.0:
          # The browsers ship in this image, at /ms-playwright. Pinning the tag
          # to the @playwright/test version keeps the two in lockstep: a newer
          # browser than the library is a flaky suite, not a fast one.
          image: "mcr.microsoft.com/playwright:v1.65.0-noble"
          platform: linux/arm64
          workdir: /workdir
          environment:
            - DOPPLER_TOKEN
    commands:
      - |
        # The vendored @nb blocks are copies, and a copy nobody checks is the
        # defect this step exists for: 1.11.0's app-shell fix reached a consumer
        # because a Homepage card grew blank space, not because CI said so. This
        # asks the registry whether the files in web/src/lib/components/nb/ still
        # match the release this repo pins in .nb-registry.json -- and whether
        # that release publishes them at all.
        #
        # The base comes from Doppler and is a HOST: the version lives in the
        # repo whose bytes are at stake, so it is named once (spec: ui-registry
        # README, "Keeping a consumer on published bytes").
        if ! command -v doppler >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
        fi
        export COMPONENTS_REGISTRY_URL="$$(doppler secrets get COMPONENTS_REGISTRY_URL --project common --config dev --plain)"
        echo "registry: $$COMPONENTS_REGISTRY_URL"
        node scripts/check-nb-blocks.mjs
        # A block names a role, never a value (ui-registry scripts/check-tokens.mjs).
        # The theme is the one file allowed a literal, because a token table is made
        # of them; everything else must say var(--role), or a re-skin silently skips it.
        node scripts/check-tokens.mjs web/src --theme web/src/app.css
      - cd web
      - npm ci --no-audit --no-fund
      - npm run lint
      - npm run build
      # The browser has to match the library, not the image tag: `npm ci`
      # resolves @playwright/test to the newest 1.65.x, while the image is
      # tagged v1.65.0 and ships *its* browser build -- a mismatch exits 1 with
      # no useful message. Installing here also means the step does not break
      # the day the image tag lags.
      - npx playwright install --with-deps chromium
      # `--list` first: it proves the config, the fixture imports and the
      # browser are all findable without running anything, and it is the one
      # line of output that survives even when the run itself stays silent.
      - npx playwright test --list
      # The suite mocks /ui/*.json: pytest owns the server contract, this owns
      # the render, so it needs neither Python nor a database.
      # `--reporter=line` writes a line per test as it starts, so a suite that
      # dies mid-way still leaves a trail.
      - npx playwright test --reporter=line

  - label: ":male-doctor: Smoke test image (starts and serves HTTP)"
    key: docker_smoke
    depends_on:
      - build
    agents:
      queue: mac-studio-linux
    env:
      SMOKE_IMAGE: data-download-smoke
    commands:
      - >-
        docker build -t "$$SMOKE_IMAGE:$$BUILDKITE_COMMIT" .
      - |
        set -euo pipefail
        CONTAINER="$$SMOKE_IMAGE-$$BUILDKITE_JOB_ID"
        # Remove the per-commit smoke image too, and survive cancellation: a
        # killed shell does not run its EXIT trap, so these leaked at ~1 GiB
        # each on mac-studio (2026-09-23: 39 images).
        trap 'exit 143' TERM INT
        trap 'docker rm -f "$$CONTAINER" >/dev/null 2>&1 || true; docker rmi "$$SMOKE_IMAGE:$$BUILDKITE_COMMIT" >/dev/null 2>&1 || true' EXIT
        docker run -d --name "$$CONTAINER" "$$SMOKE_IMAGE:$$BUILDKITE_COMMIT" >/dev/null
        # Poll the DECLARED healthcheck. A container that exits (the old rust
        # stub restart-looped) is a failure, so running is checked as well as
        # health: "not running" is reported with its logs, never mistaken for a
        # slow start.
        for i in $$(seq 1 30); do
          RUNNING="$$(docker inspect -f '{{.State.Running}}' "$$CONTAINER" 2>/dev/null || echo false)"
          HEALTH="$$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$$CONTAINER" 2>/dev/null || echo unknown)"
          echo "attempt $$i: running=$$RUNNING health=$$HEALTH"
          if [ "$$HEALTH" = "healthy" ]; then
            echo "image starts and serves HTTP (healthcheck passed)"
            exit 0
          fi
          if [ "$$RUNNING" != "true" ]; then
            echo "container is not running - it exited instead of serving:" >&2
            docker logs "$$CONTAINER" >&2 || true
            exit 1
          fi
          sleep 2
        done
        echo "container never became healthy:" >&2
        docker logs "$$CONTAINER" >&2 || true
        exit 1

  - label: ":docker: Build and publish image (GHCR)"
    key: docker_publish
    depends_on:
      - build
      - docker_smoke
    if: build.branch == "main"
    agents:
      queue: mac-studio-linux
    env:
      IMAGE: ghcr.io/nickbrett1/data-download
      CACHE_REF: ghcr.io/nickbrett1/data-download:buildcache
    commands:
      - |
        # Resolved at run time, never stored in the repository and never in the
        # agent's environment hook, where every job on the fleet could read it.
        GHCR_USERNAME=nickbrett1
        GHCR_TOKEN="$$(curl -fsS -H "Authorization: Bearer $$DOPPLER_TOKEN" "https://api.doppler.com/v3/configs/config/secret?project=common&config=prd&name=GHCR_UPDATE_TOKEN" | sed -n 's/.*"raw"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
        if [ -z "$$GHCR_TOKEN" ]; then
          echo "GHCR_UPDATE_TOKEN is missing from Doppler (common/prd) - cannot publish." >&2
          exit 1
        fi
        # One shell on purpose: Buildkite runs each command in its own shell, so
        # the credential below would be gone by the next one, and an exit 0 in a
        # separate command would not stop the commands after it.
        #
        # No `login` subcommand, and no per-job DOCKER_CONFIG. Both were tried and
        # both failed on the build host: the macOS CLI falls back to the
        # osxkeychain helper even with no credsStore configured, so two builds of
        # one commit still wrote the same keychain item and the loser died with
        # "The specified item already exists in the keychain. (-25299)"; and
        # DOCKER_CONFIG is also the root for cli-plugins, so redirecting it hides
        # `docker buildx` entirely (the next command died with "unknown flag:
        # --bootstrap", parsed by the root docker parser).
        # DOCKER_AUTH_CONFIG carries the same credential with no helper writing
        # anything, so there is no shared state left to race. See
        # specs/015-genproj-docker-publish-idempotent.
        export DOCKER_AUTH_CONFIG='{"auths":{"ghcr.io":{"auth":"'"$$(printf '%s:%s' "$$GHCR_USERNAME" "$$GHCR_TOKEN" | base64)"'"}}}'
        BUILDX_BUILDER_NAME="bk-$$BUILDKITE_PIPELINE_SLUG-$$BUILDKITE_JOB_ID"
        # Cleanup must run on cancellation too. A shell killed by SIGTERM or
        # SIGINT does not run its EXIT trap, which is exactly how builders and
        # their multi-GB BuildKit state volumes leaked (mac-studio, 2026-09-23:
        # ~38 GiB of orphaned buildx_buildkit_*_state volumes).
        trap 'exit 143' TERM INT
        trap 'docker buildx rm -f "$$BUILDX_BUILDER_NAME" >/dev/null 2>&1 || true; docker volume rm "buildx_buildkit_$$${BUILDX_BUILDER_NAME}0_state" >/dev/null 2>&1 || true' EXIT
        # Skip if this commit is already published: the release step's ls-remote
        # guard, for an image. Only a positive answer skips - if the registry
        # cannot be reached the push still runs, because "could not ask" must
        # never read as "already published".
        if docker buildx imagetools inspect "$$IMAGE:$$BUILDKITE_COMMIT" >/dev/null 2>&1; then
          echo "$$IMAGE:$$BUILDKITE_COMMIT is already in the registry - skipping the build."
          exit 0
        fi
        docker buildx create --bootstrap --name "$$BUILDX_BUILDER_NAME" >/dev/null
        # `GIT_SHA` is how a container can say which code it is running: the
        # image has no `.git`, so `data_download.coderef` cannot ask, and an
        # unset value means the store records `code_ref` NULL and every claim is
        # refused `code_ref_unresolved`. It is the build arg, not a guess.
        docker buildx build --builder "$$BUILDX_BUILDER_NAME" --platform linux/amd64 \
          --build-arg GIT_SHA=$$BUILDKITE_COMMIT \
          --cache-from type=registry,ref=$$CACHE_REF \
          --cache-to type=registry,ref=$$CACHE_REF,mode=max \
          --label org.opencontainers.image.revision=$$BUILDKITE_COMMIT \
          -t $$IMAGE:$$BUILDKITE_COMMIT -t $$IMAGE:latest --push .
